<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saltline · Flamo 创意集</title>
  <meta name="description" content="在清晨的四号泊位切断三处中继，突破机械守卫的封锁。使用 GPT-6 和 Flamo 重构渲染的浏览器第一人称射击游戏。">
  <link rel="icon" href="/common/favicon.png"><link rel="canonical" href="https://riffs.flamo.dev/saltline/">
  <link rel="stylesheet" href="./flamo-saltline-web-component/dist/component-loading.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101519;color:#ede8dd;font:15px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main{min-height:100svh;display:grid;grid-template-rows:auto 1fr}
    nav{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:48px;padding:8px max(16px,env(safe-area-inset-left));background:#141a1e;border-bottom:1px solid #343c40}
    a{color:inherit;text-decoration:none}a:hover,a:focus-visible{color:#ffbb69}nav strong{letter-spacing:.12em}nav>span{display:flex;align-items:center;gap:24px}
    .stage{display:grid;place-items:center;min-width:0}.flamo-component-shell{width:min(100vw,calc((100svh - 49px)*16/9));aspect-ratio:16/9;background:#11181b url(./saltline-poster.jpg) center/cover;--flamo-loading-accent:#ffb867;--flamo-loading-color:#fff}
    [data-flamo-status]{background:#111920aa}.support{text-align:center;padding:2rem;max-width:40rem}noscript{padding:2rem}
    .flamo-component-shell>#saltline-boot{inset:0;z-index:3;flex-direction:column;background:#101519;color:#e8e4da;text-align:center}
    #saltline-boot::before{display:none}#saltline-boot strong{font:900 clamp(34px,7vw,88px)/1 Inter,system-ui,sans-serif;letter-spacing:.16em;margin-right:-.16em}
    #saltline-boot progress{appearance:none;width:min(320px,70%);height:4px;border:0;background:#333a3e;color:#ffb347}
    #saltline-boot progress::-webkit-progress-bar{background:#333a3e}#saltline-boot progress::-webkit-progress-value{background:#ffb347;transition:width .2s}
    #saltline-boot progress::-moz-progress-bar{background:#ffb347}#saltline-boot small{font:12px ui-monospace,monospace;color:#a4afb4}
    @media(orientation:landscape) and (max-height:550px){nav{display:none}.flamo-component-shell{width:min(100vw,177.7778svh)}main{display:grid;grid-template-rows:1fr}}
  </style>
  <script type="module">
    const game=document.querySelector('flamo-saltline'),status=document.querySelector('[data-flamo-status]'),message=status.querySelector('[data-flamo-message]'),retry=status.querySelector('button');
    retry.addEventListener('click',()=>location.reload());
    function show(state,text){
      game.dataset.flamoState=state;game.inert=state!=='ready';game.setAttribute('aria-busy',String(state==='loading'||state==='static'));
      status.dataset.state=state;status.hidden=state==='ready';message.textContent=text;retry.hidden=state!=='error';
    }
    const bar=status.querySelector('progress'),count=status.querySelector('small');
    let nativeReady=false,frameReady=false,failed=false;
    function progress(value,label){
      if(failed||value<bar.value)return;
      bar.value=value;count.textContent=value+'%';message.textContent=label;
    }
    function finish(){
      if(nativeReady&&frameReady&&!failed)requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!failed)show('ready','');}));
    }
    const fail=()=>{failed=true;bar.hidden=true;count.hidden=true;show('error','游戏资源加载失败，请检查网络并重试。');};
    try {
      if (!navigator.gpu || !await navigator.gpu.requestAdapter()) {document.querySelector('.support').hidden=false;status.hidden=true;}
      else {
        show('loading','正在载入四号泊位…');
        let downloaded=4;progress(downloaded,'正在下载游戏资源…');
        for(const [name,weight] of [['interactions/bundle.js',38],['flamo-runtime/index.es.js',16]]){
          const link=document.createElement('link');link.rel='modulepreload';link.href='./flamo-saltline-web-component/dist/'+name;
          link.onload=()=>{downloaded+=weight;progress(downloaded,'正在加载 Flamo 与港区资源…');};document.head.append(link);
        }
        game.addEventListener('saltline-progress',({detail})=>{progress(detail.value,detail.label);if(detail.value===100){frameReady=true;finish();}});
        game.addEventListener('saltline-error',fail);
        game.addEventListener('flamo-ready',()=>{nativeReady=true;finish();});
        game.addEventListener('flamo-error',fail);
        await import('./flamo-saltline-web-component/dist/flamo-saltline.js');
      }
    } catch {fail();}
  </script>
</head><body><main>
  <nav aria-label="作品导航"><a href="/">← Flamo 创意集</a><span><strong>SALTLINE</strong><a href="https://flamo.dev/" target="_blank" rel="noopener noreferrer">Flamo 官网 ↗</a></span></nav>
  <section class="stage" aria-label="Saltline 游戏"><div class="flamo-component-shell">
    <flamo-saltline data-flamo-component inert aria-busy="true" loading-label="正在载入四号泊位…"></flamo-saltline>
    <div id="saltline-boot" data-flamo-status role="status" aria-live="polite"><strong>SALTLINE</strong><span data-flamo-message>正在载入四号泊位…</span><progress value="0" max="100" aria-label="游戏加载进度"></progress><small aria-hidden="true">0%</small><button hidden>刷新重试</button></div>
  </div><p class="support" hidden>当前浏览器未提供 WebGPU。请使用支持 WebGPU 的浏览器并启用硬件加速后重新进入游戏。</p><noscript>请启用 JavaScript 载入游戏。</noscript></section>
</main></body></html>
