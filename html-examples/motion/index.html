(async () => {
  const { entry, tag, entries, videos, fonts } = JSON.parse(document.getElementById('page-config').textContent);
  if (location.hash === '#flamo-export-size') {
    document.getElementById('status').hidden = true;
    const table = document.createElement('table');
    table.style.cssText = 'font:14px system-ui;width:auto;height:auto;margin:1rem';
    document.body.style.overflow = 'auto';
    const row = (cells) => { const tr = table.insertRow(); for (const value of cells) tr.insertCell().textContent = String(value); };
    row(['Block', 'Source bytes', 'Compressed bytes', 'HTML payload bytes']);
    for (const record of entries) row([record.id, record.sourceBytes, record.compressedBytes, record.embeddedBytes]);
    document.querySelector('main').replaceWith(table);
    return;
  }
  const resources = new Map();
  const pending = new Map();
  const records = new Map(entries.map((record, index) => [record.id, { ...record, index }]));
  // Undo the browser's Windows-1252 mapping, including the C1 punctuation range.
  const chars = new TextDecoder('windows-1252').decode(Uint8Array.from({length: 256}, (_, i) => i));
  const byteFor = new Uint8Array(65536);
  for (let byte = 0; byte < 256; byte++) byteFor[chars.charCodeAt(byte)] = byte;
  async function unpack(record) {
    const blockId = 'p' + record.index;
    if (!document.getElementById(blockId) && document.readyState === 'loading') {
      await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, {once: true}));
    }
    const block = document.getElementById(blockId);
    const text = block.textContent;
    const buffer = new Uint8Array(text.length);
    let length = 0;
    for (let i = 0; i < text.length; i++) {
      const char = text.charCodeAt(i);
      buffer[length++] = char === 27 ? text.charCodeAt(++i) - 64 : byteFor[char];
    }
    const bytes = buffer.subarray(0, length);
    block.remove();
    let blob = new Blob([bytes], {type: record.type});
    if (record.compressed === 'zstd') {
      blob = new Blob([globalThis.fzstd.decompress(bytes)], {type: record.type});
    } else if (record.compressed) {
      const stream = blob.stream().pipeThrough(new DecompressionStream('gzip'));
      blob = (await new Response(stream).blob()).slice(0, undefined, record.type);
    }
    // Local files have an opaque origin in Chromium. A module worker needs a
    // data URL here even though document modules can import Blob URLs.
    if (record.worker) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }
    return URL.createObjectURL(blob);
  }
  function objectURL(id) {
    if (!pending.has(id)) pending.set(id, unpack(records.get(id)));
    return pending.get(id);
  }
  function assetURL(path) {
    return resources.get('flamo:/' + path.split('/').map(encodeURIComponent).join('/'));
  }
  globalThis.__flamoPage = {
    // Only packaged resource references are mapped. Module directory arithmetic
    // still sees its stable hierarchical URL, including in the protected Runtime.
    ResourceURL: class extends URL {
      constructor(input, base) {
        const url = new URL(input, base);
        super(resources.get(url.href) ?? url.href);
      }
    },
    async load(parent, specifier, options) {
      const id = new URL(specifier, parent).href;
      if (id.startsWith('data:') || id.startsWith('blob:')) return import(id, options);
      if (!records.has(id)) throw Error('\u5355\u9875 HTML \u4e2d\u7f3a\u5c11\u6a21\u5757 ' + id);
      return import(await objectURL(id), options);
    },
    registerMedia(pool) {
      for (const {hash, path} of videos) pool.videoRegistry.registerUrl(hash, assetURL(path));
    },
  };
  const imports = Object.create(null);
  await Promise.all(entries.filter(record => record.asset || record.eager).map(async record => {
    const url = await objectURL(record.id);
    if (record.asset) resources.set(record.id, url);
    if (record.eager) imports[record.id] = url;
  }));
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({imports});
  document.head.append(map);
  await Promise.all([import(entry), ...fonts.map(async ({family, weight, style, path}) => {
    const face = new FontFace(family, 'url(' + assetURL(path) + ')', {weight, style});
    document.fonts.add(await face.load());
  })]);
  const host = document.createElement(tag);
  const status = document.getElementById('status');
  host.addEventListener('flamo-static-ready', () => { status.hidden = true; });
  host.addEventListener('flamo-ready', () => { status.hidden = true; });
  host.addEventListener('flamo-error', event => showFailure(event.detail.error));
  document.querySelector('main').append(host);
})().catch(showFailure);
function showFailure(error) {
  const status = document.getElementById('status');
  status.hidden = false;
  status.textContent = '\u9875\u9762\u52a0\u8f7d\u5931\u8d25\uff1a' + (error?.message || error);
}
